name: CASI-Net code verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install code and test dependencies
        run: python -m pip install -e . pytest
      - name: Run software tests
        run: python -m pytest -q
      - name: Check reported-aggregate arithmetic
        run: python scripts/check_reported_arithmetic.py
      - name: Check repository integrity
        run: python scripts/verify_repository_checksums.py
