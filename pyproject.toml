[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "casinet-repro"
version = "0.2.0"
description = "Code-only numerical verification utilities for the CASI-Net manuscript"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
[tool.setuptools]
packages = ["casinet_repro"]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
